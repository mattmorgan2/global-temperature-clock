[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-temperature-pipeline"
version = "0.1.0"
description = "Independent NOAA GHCN-Daily processing workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
temperature-pipeline = "temperature_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
