name: Checks
on: [push, pull_request]
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - run: python -m pip install --no-deps --no-build-isolation -e ./data-pipeline
      - run: python -m temperature_pipeline --status
      - run: python -m unittest discover -s data-pipeline/tests -v
